name: Build Mandi QC Inspector Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - 'android-app/**'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    name: Build Native APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.4'

      - name: Generate Gradle Wrapper
        working-directory: android-app
        run: |
          gradle wrapper --gradle-version 8.4

      - name: Build Debug APK
        working-directory: android-app
        run: |
          ./gradlew assembleDebug --stacktrace

      - name: Verify Built APK
        working-directory: android-app
        run: |
          ls -la app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Mandi_QC_Inspector_v1.0.apk
          path: android-app/app/build/outputs/apk/debug/app-debug.apk

      - name: Attach to GitHub Release v1.0
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.0 android-app/app/build/outputs/apk/debug/app-debug.apk#Mandi_QC_Inspector_v1.0.apk --clobber
